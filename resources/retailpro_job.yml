resources:
  jobs:
    retailpro_production_etl:
      name: RetailPro_Production_ETL_DAB

      tasks:
        - task_key: ingest_to_bronze

          spark_python_task:
            python_file: ../src/ingest_to_bronze.py

          environment_key: default

        - task_key: bronze_to_silver

          depends_on:
            - task_key: ingest_to_bronze

          spark_python_task:
            python_file: ../src/bronze_to_silver.py

          environment_key: default

        - task_key: silver_to_gold

          depends_on:
            - task_key: bronze_to_silver

          spark_python_task:
            python_file: ../src/silver_to_gold.py

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"